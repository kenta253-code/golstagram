<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golstagram">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
    
    <title>Golstagram - ゴルフ想い出＆スコア共有</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;700&family=Comfortaa:wght@700&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root, body[data-theme="sepia"] {
            --primary: #23382b;
            --primary-light: #e4dcce;
            --primary-hover: #17261d;
            --gold: #b38743;
            --gold-light: #ece3d0;
            --gold-border: #d5c7ab;
            --bg: #efe8db;
            --card: #faf7f0;
            --text-main: #332b24;
            --text-sub: #7a7064;
            --border: #ddd4c1;
            --danger: #b84343;
            --line-green: #06c755;
            --my-bubble-bg: #2b4534;
            --header-bg: linear-gradient(135deg, #253328 0%, #1a241c 100%);
            --header-text: #f7f4ee;
            --tab-bg: rgba(250, 247, 240, 0.98);
            --comment-bg: #f4eee2;
            --shadow-sm: 0 2px 8px rgba(60, 48, 36, 0.05);
            --shadow-md: 0 8px 24px rgba(60, 48, 36, 0.08);
            --shadow-lg: 0 12px 32px rgba(60, 48, 36, 0.12);
        }

        body[data-theme="light"] {
            --primary: #1e4620;
            --primary-light: #e8f5e9;
            --primary-hover: #143216;
            --gold: #c59b27;
            --gold-light: #fff8e1;
            --gold-border: #ffe082;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --line-green: #06c755;
            --my-bubble-bg: #1e4620;
            --header-bg: linear-gradient(135deg, #1e4620 0%, #143216 100%);
            --header-text: #ffffff;
            --tab-bg: rgba(255, 255, 255, 0.98);
            --comment-bg: #f9fafb;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
        }

        body[data-theme="dark"] {
            --primary: #4ade80;
            --primary-light: #1e293b;
            --primary-hover: #22c55e;
            --gold: #facc15;
            --gold-light: #332a14;
            --gold-border: #715814;
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --danger: #f87171;
            --line-green: #06c755;
            --my-bubble-bg: #15803d;
            --header-bg: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --header-text: #f8fafc;
            --tab-bg: rgba(30, 41, 59, 0.98);
            --comment-bg: #0f172a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; touch-action: pan-y; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            padding-top: calc(56px + env(safe-area-inset-top));
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
            letter-spacing: 0.02em;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .font-golsta { font-family: 'Outfit', 'Comfortaa', sans-serif; font-weight: 800; letter-spacing: -0.02em; }

        header {
            background: var(--header-bg);
            color: var(--header-text);
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: 12px;
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            position: fixed;
            top: 0; left: 0; right: 0; width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--gold);
        }
        .logo-container { display: flex; align-items: baseline; gap: 8px; }
        .golstagram-logo {
            font-family: 'Outfit', 'Comfortaa', sans-serif;
            font-size: 24px; font-weight: 800; letter-spacing: -0.04em;
            color: #ffffff; display: inline-flex; align-items: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3); line-height: 1;
        }
        .golstagram-logo span.gold-dot { color: var(--gold); font-size: 28px; line-height: 0; margin-left: 1px; }
        .header-tagline {
            font-family: 'Alex Brush', cursive;
            font-size: 15px; color: #ffffff; letter-spacing: 0.03em;
            font-weight: 400; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .btn-settings-gear {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #ffffff; transition: all 0.2s ease;
        }
        .btn-settings-gear:hover { background: rgba(255, 255, 255, 0.22); transform: rotate(30deg); }
        .btn-settings-gear svg { width: 18px; height: 18px; fill: #ffffff; }

        .section-header-title { font-size: 20px; font-weight: 700; color: var(--primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .section-header-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 16px; }

        .tab-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: calc(68px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--tab-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
            box-shadow: 0 -4px 18px rgba(0,0,0,0.08);
            transition: background 0.25s ease;
        }
        .tab-btn {
            background: none; border: none; font-size: 11px;
            color: var(--text-sub); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
            cursor: pointer; transition: all 0.2s ease; padding: 8px 4px;
            border-radius: 10px; flex: 1; height: 100%;
        }
        .tab-btn.active { color: var(--primary); font-weight: 700; }
        .tab-btn.active svg { fill: var(--primary); filter: drop-shadow(0 2px 4px rgba(35, 56, 43, 0.25)); transform: translateY(-1px); }
        .tab-btn svg { width: 24px; height: 24px; fill: var(--text-sub); transition: 0.2s; }

        .container { max-width: 600px; margin: 0 auto; padding: 16px; width: 100%; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.25s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* ========= FAB フローティングボタングループ ========= */
        .fab-container {
            position: fixed;
            right: 16px;
            bottom: calc(84px + env(safe-area-inset-bottom));
            display: flex;
            gap: 8px;
            z-index: 95;
        }

        .fab-match {
            background: linear-gradient(135deg, #1e4620 0%, #2f6834 100%);
            color: #ffffff;
            border: 2px solid var(--gold);
            border-radius: 34px;
            padding: 14px 18px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(30, 70, 32, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.03em;
        }
        .fab-match:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 28px rgba(30, 70, 32, 0.55); }
        .fab-match:active { transform: translateY(0) scale(0.97); }

        .fab {
            background: linear-gradient(135deg, #ff4081 0%, #e91e63 100%);
            color: #ffffff;
            border: 2px solid #ff80ab;
            border-radius: 34px;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.03em;
        }
        .fab:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 28px rgba(233, 30, 99, 0.55); }
        .fab:active { transform: translateY(0) scale(0.97); }

        .card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s, background 0.25s;
        }

        .card-header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .avatar-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-border); background: #e6dfd1; flex-shrink: 0; }
        .avatar-img-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold-border); flex-shrink: 0; background: #ded5c2; }
        .user-name-text { font-size: 14px; font-weight: 700; color: var(--text-main); }
        
        .carousel-wrapper { position: relative; width: 100%; background: #000; }
        .carousel-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; width: 100%; height: 260px; scroll-snap-align: start; position: relative; }
        .carousel-img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
        .carousel-count-badge {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
            color: #ffffff; font-size: 11px; font-weight: 700;
            padding: 3px 8px; border-radius: 12px; z-index: 5; letter-spacing: 0.05em;
        }
        .carousel-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 5; pointer-events: none; }
        .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); transition: all 0.2s ease; }
        .carousel-dot.active { background: var(--gold); width: 14px; border-radius: 4px; }

        .card-body { padding: 16px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
        .card-date { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .score-highlight {
            font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
            color: var(--primary); background: var(--gold-light);
            border: 1px solid var(--gold-border); padding: 4px 10px;
            border-radius: 6px; display: inline-block;
        }

        .btn-card-delete {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 4px 10px; font-size: 11px;
            cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .btn-card-delete:hover { background: var(--danger); }

        .card-action-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border);
        }
        .left-actions { display: flex; align-items: center; gap: 8px; }
        .btn-action {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 6px 13px; font-size: 12px;
            font-weight: 700; color: var(--text-main); cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-action:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .btn-action.liked { background: #fde8e8; border-color: #fca5a5; color: #dc2626; }

        /* ========= 💬 未読コメント用バッジスタイル ========= */
        .btn-action.has-unread-comments {
            border-color: #ff4081 !important;
            background: rgba(255, 64, 129, 0.08) !important;
            position: relative;
        }
        .unread-comment-badge {
            background: #ff4081;
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            box-shadow: 0 0 8px rgba(255, 64, 129, 0.6);
            animation: unreadPulse 1.8s infinite ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes unreadPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }

        .btn-line-share {
            display: inline-flex; align-items: center; gap: 5px;
            background-color: var(--line-green); color: #ffffff;
            border: none; border-radius: 6px; padding: 6px 11px;
            font-size: 11px; font-weight: 700; cursor: pointer;
            transition: 0.2s; text-decoration: none;
        }
        .btn-line-share:hover { opacity: 0.9; }
        .btn-line-share svg { width: 14px; height: 14px; fill: #ffffff; }

        /* ========= 🌟 Golstaマッチ専用カードデザイン ========= */
        .match-card {
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, #fffcf5 0%, #faf4e6 100%);
            box-shadow: 0 8px 24px rgba(179, 135, 67, 0.15);
            position: relative;
            overflow: hidden;
        }
        body[data-theme="dark"] .match-card {
            background: linear-gradient(135deg, #1e2638 0%, #151c28 100%);
        }

        .match-header-bar {
            background: linear-gradient(135deg, #23382b 0%, #344d3d 100%);
            color: #ffffff;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gold);
        }
        .match-status-badge {
            background: #ffeb3b;
            color: #795548;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .match-confirmed-banner {
            background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #aa7c11 100%);
            color: #ffffff;
            padding: 14px;
            text-align: center;
            border-bottom: 2px solid #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .match-confirmed-title {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* ========= 投票テーブル基本スタイル ========= */
        .match-vote-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin: 10px 0;
            background: var(--card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .match-vote-table th, .match-vote-table td {
            border: 1px solid var(--border);
            padding: 8px 6px;
            text-align: center;
        }
        .match-vote-table th {
            background: var(--gold-light);
            color: var(--primary);
            font-weight: 700;
        }

        /* ========= 投票ステータス表示（全テーマ共通・枠線＆背景なし） ========= */
        .vote-badge-ok,
        .vote-badge-maybe,
        .vote-badge-ng {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            font-weight: 800;
        }
        .vote-badge-ok { color: #15803d; }
        .vote-badge-maybe { color: #b45309; }
        .vote-badge-ng { color: #b91c1c; }

        body[data-theme="dark"] .vote-badge-ok { color: #4ade80; }
        body[data-theme="dark"] .vote-badge-maybe { color: #facc15; }
        body[data-theme="dark"] .vote-badge-ng { color: #f87171; }

        /* ========= 🌟 AI映えアワード専用カードデザイン ========= */
        .award-banner-card {
            background: linear-gradient(135deg, #fffdf8 0%, #faf3e0 100%);
            border: 2px solid #e2bc58;
            box-shadow: 0 10px 25px rgba(226, 188, 88, 0.2);
            position: relative;
            overflow: hidden;
        }
        body[data-theme="dark"] .award-banner-card {
            background: linear-gradient(135deg, #1e2530 0%, #151d27 100%);
            border-color: #facc15;
        }
        .award-badge-header {
            background: linear-gradient(135deg, #dfa938 0%, #c48b17 100%);
            color: #ffffff;
            padding: 10px 16px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.05em;
        }
        .award-item-block {
            border-top: 1px dashed var(--gold-border);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .award-item-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 13px;
            border-radius: 20px;
            padding: 4px 12px;
            width: fit-content;
        }
        .badge-grand { background: #fff3c4; color: #9a6500; border: 1px solid #ffd166; }
        .badge-excellence { background: #e6f4ea; color: #137333; border: 1px solid #a8dab5; }
        .badge-booby { background: #fce8e6; color: #c5221f; border: 1px solid #f6aea9; }

        .award-photo-container {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            margin: 6px 0;
            border: 1px solid var(--border);
        }
        .award-photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .award-judge-bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-main);
        }
        .award-judge-name {
            font-weight: 800;
            color: var(--primary);
            font-size: 11px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* コメントボトムシート */
        .comment-sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1050;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .comment-sheet-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .comment-sheet {
            background: var(--card);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-top: 2px solid var(--gold);
            width: 100%;
            max-width: 600px;
            height: 75vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.3);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .comment-sheet-overlay.active .comment-sheet {
            transform: translateY(0) !important;
        }

        .comment-sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--card);
        }
        .comment-sheet-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .btn-close-sheet { background: none; border: none; font-size: 18px; color: var(--text-sub); cursor: pointer; padding: 4px; }
        .comment-sheet-list {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--comment-bg);
        }
        .comment-sheet-footer {
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px;
        }

        .chat-row-other { display: flex; align-items: flex-end; gap: 8px; width: 100%; }
        .chat-content-other { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; }
