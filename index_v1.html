<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golstagram - No Golf, No Life</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root {
            --primary: #1b382b;
            --primary-light: #2c5442;
            --gold: #c5a059;
            --gold-light: #e5c887;
            --gold-border: rgba(197, 160, 89, 0.4);
            --bg: #f4f6f4;
            --card-bg: #ffffff;
            --card-sub-bg: #f8faf8;
            --text-main: #222222;
            --text-sub: #666666;
            --border: #e2e8e0;
            --danger: #d9534f;
            --nav-height: 60px;
            --header-height: 54px;
        }

        body.theme-dark {
            --primary: #2d5a45;
            --primary-light: #3d755b;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-border: rgba(212, 175, 55, 0.3);
            --bg: #121815;
            --card-bg: #1a231f;
            --card-sub-bg: #222e29;
            --text-main: #e8ebe9;
            --text-sub: #9eaba3;
            --border: #2c3b34;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding-top: var(--header-height);
            padding-bottom: calc(var(--nav-height) + 20px);
            min-height: 100vh;
        }

        .font-golsta {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        /* ヘッダー */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-title {
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .header-sub {
            font-size: 10px;
            color: var(--gold-light);
            font-style: italic;
            font-family: 'Cinzel', serif;
        }

        .header-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
        }

        /* メインコンテナ */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px 14px;
        }

        /* 画面タブ */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* 下部ナビゲーション */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-sub);
            font-size: 10px;
            cursor: pointer;
            border: none;
            background: none;
            gap: 3px;
        }

        .nav-item.active {
            color: var(--gold);
            font-weight: 700;
        }

        .nav-item i {
            font-size: 17px;
        }

        /* カード */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        /* フォーム部品 */
        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* ボタン */
        .btn-main {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .btn-sub {
            background: var(--card-sub-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* トースト通知 */
        #toast {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 35, 27, 0.95);
            color: #fff;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border: 1px solid var(--gold);
            text-align: center;
            max-width: 85%;
        }
        #toast.show {
            opacity: 1;
        }

        /* ドリルダウン用 */
        .drilldown-container {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }
        .drilldown-container.open {
            display: block;
        }
        .drilldown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            background: var(--card-sub-bg);
            margin-bottom: 6px;
            cursor: pointer;
        }
        .drilldown-thumb {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="app-header">
        <div class="header-title">
            <span class="font-golsta">Golstagram</span>
            <span class="header-sub">No Golf, No Life</span>
        </div>
        <button class="header-btn" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i></button>
    </header>

    <!-- 🔑 初回ログイン・登録モーダル -->
    <div id="authModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999999; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: var(--card-bg); width: 100%; max-width: 360px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; border: 2px solid var(--gold);">
            <h3 style="color: var(--primary); font-size: 18px; margin-bottom: 6px; text-align: center; font-weight: 700;">
                ⛳ <span class="font-golsta">Golstagram</span>
            </h3>
            <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 18px; text-align: center; line-height: 1.4;">
                ユーザーIDを設定すると、PCやスマホ間で同じデータを引き継いで利用できます。
            </p>

            <div class="form-group" style="margin-bottom: 14px;">
                <label class="form-label">ユーザーID（半角英数字・変更不可）</label>
                <input type="text" id="authUserIdInput" class="form-control" placeholder="例: kenta1971" style="text-transform: lowercase;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label">お名前（表示名）</label>
                <input type="text" id="authUserNameInput" class="form-control" placeholder="例: 長原 健太">
            </div>

            <button class="btn-main" onclick="handleAuthSubmit()">Golstagram を始める</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="app-container">
        
        <!-- タイムライン画面 -->
        <section id="screen-timeline" class="screen active">
            <button class="btn-main" style="margin-bottom: 14px; padding: 12px;" onclick="openNewRegistration()">
                <i class="fa-solid fa-plus"></i> 新しいラウンドを記録する
            </button>
            <div id="timeline-list">
                <p style="text-align: center; color: var(--text-sub); padding: 30px 0;">ラウンド履歴を読み込み中...</p>
            </div>
        </section>

        <!-- ギャラリー画面 -->
        <section id="screen-gallery" class="screen">
            <div id="gallery-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;"></div>
        </section>

        <!-- 振り返り画面 (Memory) -->
        <section id="screen-summary" class="screen">
            <div style="display: flex; gap: 8px; margin-bottom: 14px;">
                <button class="btn-sub" id="btn-sum-members" style="flex:1; font-weight:700;" onclick="switchSummaryTab('members')">👤 メンバー別対戦</button>
                <button class="btn-sub" id="btn-sum-courses" style="flex:1;" onclick="switchSummaryTab('courses')">⛳ ゴルフ場別履歴</button>
            </div>
            <div id="summary-content"></div>
        </section>

        <!-- 分析画面 (Analytics) -->
        <section id="screen-analytics" class="screen">
            <div class="card" style="padding: 16px;" id="analytics-content">
                <p style="text-align: center; color: var(--text-sub);">分析データを読み込み中...</p>
            </div>
        </section>

        <!-- メンバー・プロフィール画面 -->
        <section id="screen-members" class="screen">
            <!-- ユーザー自身のプロフィール -->
            <div class="card" style="padding: 18px; border: 2px solid var(--gold-border);">
                <h3 style="margin-bottom: 14px; color: var(--primary); font-size: 16px;">👤 あなたのプロフィール</h3>
                <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
                    <img id="myAvatarImg" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold);">
                    <div style="flex: 1;">
                        <label class="form-label" style="margin-bottom: 2px;">アイコン画像</label>
                        <input type="file" id="myAvatarFile" accept="image/*" class="form-control" style="font-size: 11px; padding: 5px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="color: var(--text-sub);">ユーザーID（他端末同期用）</label>
                    <input type="text" id="myProfileId" class="form-control" style="background: var(--card-sub-bg); color: var(--text-sub);" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">氏名（表示名）</label>
                    <input type="text" id="myProfileName" class="form-control" value="長原 健太">
                </div>

                <button class="btn-main" onclick="saveMyProfile()">プロフィールを更新保存</button>
                <button type="button" class="btn-sub" style="width: 100%; margin-top: 10px; background: none; border: 1px dashed var(--gold-border);" onclick="openSwitchAccountModal()">🔑 別IDでログイン / アカウント切替</button>
            </div>

            <!-- ゴルフ仲間の登録 -->
            <div class="card" style="padding: 18px;">
                <h3 style="margin-bottom: 14px; color: var(--primary); font-size: 16px;">👥 ゴルフ仲間の登録</h3>
                <div class="form-group">
                    <label class="form-label">仲間のお名前</label>
                    <input type="text" id="newFriendName" class="form-control" placeholder="例: 田中 太郎">
                </div>
                <button class="btn-sub" style="width: 100%;" onclick="addFriend()">仲間をリストに追加</button>
                
                <h4 style="margin-top: 16px; margin-bottom: 8px; font-size: 13px; color: var(--text-sub);">📋 登録済みゴルフ仲間一覧</h4>
                <div id="friendsList" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
            </div>
        </section>

    </main>

    <!-- ラウンド新規登録・編集モーダル -->
    <div id="recordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 10000; overflow-y: auto; padding: 16px 12px 60px;">
        <div class="card" style="max-width: 560px; margin: 0 auto; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="recordModalTitle" style="color: var(--primary); font-size: 17px; font-weight: 700;">⛳ ラウンド記録</h3>
                <button onclick="closeRecordModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">&times;</button>
            </div>

            <input type="hidden" id="editRoundId" value="">

            <div class="form-group">
                <label class="form-label">プレー日</label>
                <input type="date" id="playDate" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">ゴルフ場・コース名</label>
                <input type="text" id="courseName" class="form-control" placeholder="例: 熱海ゴルフ倶楽部" style="margin-bottom: 6px;">
                <select id="quickCourseSelect" class="form-control" style="font-size: 12px; padding: 6px 10px; color: var(--text-sub); border: 1px dashed var(--gold-border);" onchange="applyQuickCourseName(this)">
                    <option value="">▼ 過去のコース履歴から選ぶ</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">公開設定</label>
                <select id="visibility" class="form-control">
                    <option value="public">🌐 全体公開（タイムラインに表示）</option>
                    <option value="private">🔒 非公開（自分と同伴者のみ）</option>
                </select>
            </div>

            <!-- スコア入力エリア（最大4名） -->
            <div style="margin-top: 16px; margin-bottom: 12px;">
                <label class="form-label">スコア入力（最大4名）</label>
                <div id="playersInputArea"></div>
            </div>

            <div class="form-group">
                <label class="form-label">思い出・メモ</label>
                <textarea id="roundMemo" class="form-control" rows="3" placeholder="天気、バーディ数、ランチなど"></textarea>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 18px;">
                <button class="btn-sub" style="flex: 1;" onclick="closeRecordModal()">キャンセル</button>
                <button class="btn-main" style="flex: 2;" onclick="saveRound()">ラウンドを保存する</button>
            </div>
        </div>
    </div>

    <!-- 詳細表示モーダル -->
    <div id="detailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 10000; overflow-y: auto; padding: 16px 12px 60px;">
        <div class="card" style="max-width: 560px; margin: 0 auto; padding: 20px;" id="detailContent"></div>
    </div>

    <!-- 設定・アワード審査モーダル -->
    <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; padding: 16px;">
        <div class="card" style="width: 100%; max-width: 380px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: var(--primary); font-size: 16px;">⚙️ 設定・管理</h3>
                <button onclick="closeSettingsModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">外観テーマ</label>
                <button class="btn-sub" style="width: 100%;" onclick="toggleTheme()">🌓 ダーク / ライトモード切替</button>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border); margin: 16px 0;">

            <div class="form-group">
                <label class="form-label">🏆 月間AIアワード手動審査</label>
                <input type="month" id="awardTargetMonth" class="form-control" style="margin-bottom: 8px;">
                <button class="btn-main" onclick="triggerManualAward()">AI審査員を招集して審査実行</button>
            </div>
        </div>
    </div>

    <!-- 下部ナビゲーションバー -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchNav('timeline')"><i class="fa-solid fa-house"></i><span>タイムライン</span></button>
        <button class="nav-item" onclick="switchNav('gallery')"><i class="fa-solid fa-images"></i><span>ギャラリー</span></button>
        <button class="nav-item" onclick="switchNav('summary')"><i class="fa-solid fa-users"></i><span>振り返り</span></button>
        <button class="nav-item" onclick="switchNav('analytics')"><i class="fa-solid fa-chart-line"></i><span>分析</span></button>
        <button class="nav-item" onclick="switchNav('members')"><i class="fa-solid fa-user"></i><span>メンバー</span></button>
    </nav>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <!-- Firebase設定 & アプリロジック -->
    <script>
        // -------------------------------------------------------------
        // Firebase 初期化
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_ReplaceWithYourOwn",
            authDomain: "golstagram-app.firebaseapp.com",
            projectId: "golstagram-app",
            storageBucket: "golstagram-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // -------------------------------------------------------------
        // グローバル変数
        // -------------------------------------------------------------
        let myProfile = {
            id: '',
            name: '長原 健太',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
        };

        let myFriends = JSON.parse(localStorage.getItem('golf_friends') || '["天笠","風間","幸四郎","滋賀秀達","樋山","リエ","レナ"]');
        let rounds = [];
        let currentSummaryTab = 'members';

        // -------------------------------------------------------------
        // トースト & アラート
        // -------------------------------------------------------------
        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showAppAlert(title, text) {
            return new Promise(resolve => {
                alert(`${title}\n\n${text}`);
                resolve(true);
            });
        }

        // -------------------------------------------------------------
        // 🔑 認証 & ログイン管理
        // -------------------------------------------------------------
        function checkUserAuth() {
            const savedProfileStr = localStorage.getItem('golf_my_profile');
            let needsAuth = false;

            if (!savedProfileStr) {
                needsAuth = true;
            } else {
                try {
                    myProfile = JSON.parse(savedProfileStr);
                    if (!myProfile.id) {
                        needsAuth = true;
                        const nameInput = document.getElementById('authUserNameInput');
                        if (nameInput && myProfile.name) nameInput.value = myProfile.name;
                    }
                } catch (e) {
                    needsAuth = true;
                }
            }

            const modal = document.getElementById('authModal');
            if (needsAuth && modal) {
                modal.style.display = 'flex';
            } else if (modal) {
                modal.style.display = 'none';
                initProfileScreen();
            }
        }

        function openSwitchAccountModal() {
            const modal = document.getElementById('authModal');
            if (modal) {
                document.getElementById('authUserIdInput').value = myProfile.id || '';
                document.getElementById('authUserNameInput').value = myProfile.name || '';
                modal.style.display = 'flex';
            }
        }

        async function handleAuthSubmit() {
            const rawId = document.getElementById('authUserIdInput').value.trim().toLowerCase();
            const rawName = document.getElementById('authUserNameInput').value.trim();

            if (!rawId) {
                await showAppAlert('入力確認', 'ユーザーIDを半角英数字で入力してください。');
                return;
            }

            try {
                const userDoc = await db.collection("users").doc(rawId).get();

                if (userDoc.exists) {
                    const userData = userDoc.data();
                    myProfile = {
                        id: rawId,
                        name: userData.name || rawName || '長原 健太',
                        avatar: userData.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
                    };
                    showToast(`🎉 「${myProfile.name}」としてログインしました！`);
                } else {
                    const name = rawName || '長原 健太';
                    myProfile = {
                        id: rawId,
                        name: name,
                        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'
                    };
                    await db.collection("users").doc(rawId).set({
                        id: rawId,
                        name: name,
                        avatar: myProfile.avatar,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast(`🎉 プロフィールを新規登録しました！`);
                }

                localStorage.setItem('golf_my_profile', JSON.stringify(myProfile));
                document.getElementById('authModal').style.display = 'none';
                initProfileScreen();
                renderTimeline();
                if (currentSummaryTab) renderSummary(currentSummaryTab);
            } catch (err) {
                await showAppAlert('エラー', 'ログイン処理に失敗しました: ' + err.message);
            }
        }

        function initProfileScreen() {
            const idInput = document.getElementById('myProfileId');
            if (idInput) idInput.value = myProfile.id || '';
            const nameInput = document.getElementById('myProfileName');
            if (nameInput) nameInput.value = myProfile.name || '長原 健太';
            const avatarImg = document.getElementById('myAvatarImg');
            if (avatarImg && myProfile.avatar) avatarImg.src = myProfile.avatar;
            renderFriendsList();
        }

        async function saveMyProfile() {
            const newName = document.getElementById('myProfileName').value.trim() || '長原 健太';
            myProfile.name = newName;

            const avatarFile = document.getElementById('myAvatarFile').files[0];
            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    myProfile.avatar = e.target.result;
                    await syncProfileToCloud();
                };
                reader.readAsDataURL(avatarFile);
            } else {
                await syncProfileToCloud();
            }
        }

        async function syncProfileToCloud() {
            localStorage.setItem('golf_my_profile', JSON.stringify(myProfile));
            if (myProfile.id) {
                try {
                    await db.collection("users").doc(myProfile.id).set({
                        id: myProfile.id,
                        name: myProfile.name,
                        avatar: myProfile.avatar,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('✅ プロフィールを保存しました');
                    initProfileScreen();
                } catch (e) {
                    showToast('ローカルに保存しました');
                }
            }
        }

        // -------------------------------------------------------------
        // ゴルフ仲間管理
        // -------------------------------------------------------------
        function renderFriendsList() {
            const container = document.getElementById('friendsList');
            if (!container) return;
            container.innerHTML = myFriends.map((f, idx) => `
                <span style="background:var(--card-sub-bg); padding:4px 10px; border-radius:15px; font-size:12px; border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px;">
                    ${f}
                    <i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--text-sub);" onclick="removeFriend(${idx})"></i>
                </span>
            `).join('') || '<span style="color:var(--text-sub); font-size:12px;">登録された仲間はいません</span>';
        }

        function addFriend() {
            const input = document.getElementById('newFriendName');
            const name = input.value.trim();
            if (!name) return;
            if (!myFriends.includes(name)) {
                myFriends.push(name);
                localStorage.setItem('golf_friends', JSON.stringify(myFriends));
                renderFriendsList();
                input.value = '';
                showToast(`👥 ${name} さんを仲間に追加しました`);
            }
        }

        function removeFriend(idx) {
            myFriends.splice(idx, 1);
            localStorage.setItem('golf_friends', JSON.stringify(myFriends));
            renderFriendsList();
        }

        // -------------------------------------------------------------
        // ナビゲーション切り替え
        // -------------------------------------------------------------
        function switchNav(tabName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            const targetScreen = document.getElementById(`screen-${tabName}`);
            if (targetScreen) targetScreen.classList.add('active');

            const navBtns = document.querySelectorAll('.nav-item');
            const map = { 'timeline': 0, 'gallery': 1, 'summary': 2, 'analytics': 3, 'members': 4 };
            if (map[tabName] !== undefined && navBtns[map[tabName]]) {
                navBtns[map[tabName]].classList.add('active');
            }

            if (tabName === 'gallery') renderGallery();
            if (tabName === 'summary') renderSummary(currentSummaryTab);
            if (tabName === 'analytics') renderAnalytics();
        }

        // -------------------------------------------------------------
        // Firestore リアルタイムリスナー
        // -------------------------------------------------------------
        function initFirestoreListener() {
            db.collection("rounds").orderBy("playDate", "desc").onSnapshot((snapshot) => {
                rounds = [];
                snapshot.forEach(doc => {
                    rounds.push({ id: doc.id, ...doc.data() });
                });
                renderTimeline();
                updateCourseDatalist();
                if (document.getElementById('screen-summary').classList.contains('active')) {
                    renderSummary(currentSummaryTab);
                }
            }, (error) => {
                console.error("Firestore Listen error:", error);
            });
        }

        // -------------------------------------------------------------
        // タイムライン描画
        // -------------------------------------------------------------
        function renderTimeline() {
            const listEl = document.getElementById('timeline-list');
            if (!listEl) return;

            if (rounds.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:var(--text-sub); padding:40px 0;">まだラウンド記録がありません。<br>「新しいラウンドを記録する」から登録してみましょう！</p>';
                return;
            }

            listEl.innerHTML = rounds.map(r => {
                if (r.isAwardPost) {
                    // アワード投稿カード
                    return `
                        <div class="card" style="border:2px solid var(--gold); background:linear-gradient(180deg, var(--card-bg) 0%, var(--card-sub-bg) 100%);">
                            <div style="padding:14px 16px; border-bottom:1px solid var(--gold-border); display:flex; justify-content:space-between; align-items:center;">
                                <div style="font-weight:700; color:var(--gold); font-size:15px;">🏆 ${r.title || '月間AIアワード'}</div>
                                <span style="font-size:11px; color:var(--text-sub);">${r.playDate || ''}</span>
                            </div>
                            <div style="padding:16px;">
                                <p style="font-size:13px; line-height:1.6; white-space:pre-wrap;">${r.memo || ''}</p>
                            </div>
                        </div>
                    `;
                }

                // 通常ラウンドカード
                const photoUrl = (r.photos && r.photos[r.bestPhotoIndex]) || (r.photos && r.photos[0]) || 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600';
                const isMyPost = (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name);

                const playersHtml = (r.players || []).map(p => `
                    <div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px dashed var(--border);">
                        <span>👤 <strong>${p.cart_name}</strong></span>
                        <span style="font-family:'Cinzel',serif; font-weight:700; color:var(--primary);">${p.total_score || '-'} <small style="font-size:10px; color:var(--text-sub); font-family:sans-serif;">(${p.putts || '-'}pt)</small></span>
                    </div>
                `).join('');

                return `
                    <div class="card">
                        <div style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <img src="${r.authorAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                                <div>
                                    <div style="font-size:13px; font-weight:700;">${r.authorName || 'ゴルファー'}</div>
                                    <div style="font-size:11px; color:var(--text-sub);">📅 ${r.playDate} ｜ ⛳ ${r.courseName}</div>
                                </div>
                            </div>
                            ${isMyPost ? `
                                <button class="btn-sub" style="padding:4px 8px; font-size:11px;" onclick="openEditRegistration('${r.id}')">✏️ 編集</button>
                            ` : ''}
                        </div>

                        <img src="${photoUrl}" style="width:100%; height:240px; object-fit:cover; cursor:pointer;" onclick="showDetail('${r.id}')">

                        <div style="padding:14px;">
                            <div style="margin-bottom:10px;">${playersHtml}</div>
                            ${r.memo ? `<p style="font-size:13px; color:var(--text-sub); line-height:1.5; margin-top:8px;">${r.memo}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // -------------------------------------------------------------
        // コース名クイック選択
        // -------------------------------------------------------------
        function updateCourseDatalist() {
            const selectEl = document.getElementById('quickCourseSelect');
            if (!selectEl) return;
            const pastCourses = rounds.filter(r => !r.isAwardPost && r.courseName).map(r => r.courseName.trim());
            const uniqueCourses = Array.from(new Set(pastCourses)).filter(Boolean);

            let optionsHtml = '<option value="">▼ 過去のコース履歴から選ぶ</option>';
            uniqueCourses.forEach(c => {
                optionsHtml += `<option value="${c}">${c}</option>`;
            });
            selectEl.innerHTML = optionsHtml;
        }

        function applyQuickCourseName(selectEl) {
            if (!selectEl.value) return;
            document.getElementById('courseName').value = selectEl.value;
            selectEl.value = '';
        }

        // -------------------------------------------------------------
        // ラウンド新規登録 & 編集
        // -------------------------------------------------------------
        function openNewRegistration() {
            document.getElementById('editRoundId').value = '';
            document.getElementById('recordModalTitle').textContent = '⛳ 新規ラウンド記録';
            document.getElementById('playDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('courseName').value = '';
            document.getElementById('roundMemo').value = '';
            renderPlayerInputs();
            document.getElementById('recordModal').style.display = 'block';
        }

        function openEditRegistration(roundId) {
            const r = rounds.find(item => item.id === roundId);
            if (!r) return;
            document.getElementById('editRoundId').value = r.id;
            document.getElementById('recordModalTitle').textContent = '✏️ ラウンド記録の編集';
            document.getElementById('playDate').value = r.playDate || '';
            document.getElementById('courseName').value = r.courseName || '';
            document.getElementById('visibility').value = r.visibility || 'public';
            document.getElementById('roundMemo').value = r.memo || '';
            renderPlayerInputs(r.players);
            document.getElementById('recordModal').style.display = 'block';
        }

        function closeRecordModal() {
            document.getElementById('recordModal').style.display = 'none';
        }

        function renderPlayerInputs(existingPlayers = null) {
            const area = document.getElementById('playersInputArea');
            if (!area) return;

            let players = existingPlayers || [
                { cart_name: myProfile.name || '長原 健太', out_score: '', in_score: '', total_score: '', putts: '' },
                { cart_name: '', out_score: '', in_score: '', total_score: '', putts: '' },
                { cart_name: '', out_score: '', in_score: '', total_score: '', putts: '' },
                { cart_name: '', out_score: '', in_score: '', total_score: '', putts: '' }
            ];

            while (players.length < 4) {
                players.push({ cart_name: '', out_score: '', in_score: '', total_score: '', putts: '' });
            }

            area.innerHTML = players.map((p, idx) => `
                <div style="background:var(--card-sub-bg); padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid var(--border);">
                    <div style="display:flex; gap:6px; margin-bottom:6px;">
                        <input type="text" id="p_name_${idx}" class="form-control" style="flex:2;" placeholder="プレイヤー${idx+1} 氏名" value="${p.cart_name || ''}">
                        <select class="form-control" style="flex:1.2; font-size:11px;" onchange="if(this.value){ document.getElementById('p_name_${idx}').value = this.value; this.value=''; }">
                            <option value="">▼ 呼出</option>
                            <option value="${myProfile.name}">${myProfile.name}</option>
                            ${myFriends.map(f => `<option value="${f}">${f}</option>`).join('')}
                        </select>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <input type="number" id="p_out_${idx}" class="form-control" placeholder="OUT" value="${p.out_score || ''}" oninput="calcTotal(${idx})">
                        <input type="number" id="p_in_${idx}" class="form-control" placeholder="IN" value="${p.in_score || ''}" oninput="calcTotal(${idx})">
                        <input type="number" id="p_total_${idx}" class="form-control" placeholder="合計" value="${p.total_score || ''}" style="font-weight:700;">
                        <input type="number" id="p_putts_${idx}" class="form-control" placeholder="PT" value="${p.putts || ''}">
                    </div>
                </div>
            `).join('');
        }

        function calcTotal(idx) {
            const outS = parseInt(document.getElementById(`p_out_${idx}`).value) || 0;
            const inS = parseInt(document.getElementById(`p_in_${idx}`).value) || 0;
            if (outS || inS) {
                document.getElementById(`p_total_${idx}`).value = outS + inS;
            }
        }

        async function saveRound() {
            const editId = document.getElementById('editRoundId').value;
            const playDate = document.getElementById('playDate').value;
            const courseName = document.getElementById('courseName').value.trim();
            const visibility = document.getElementById('visibility').value;
            const memo = document.getElementById('roundMemo').value.trim();

            if (!courseName) {
                await showAppAlert('入力確認', 'ゴルフ場・コース名を入力してください。');
                return;
            }

            const players = [];
            for (let i = 0; i < 4; i++) {
                const name = document.getElementById(`p_name_${i}`).value.trim();
                const total = parseInt(document.getElementById(`p_total_${i}`).value) || null;
                const outS = parseInt(document.getElementById(`p_out_${i}`).value) || null;
                const inS = parseInt(document.getElementById(`p_in_${i}`).value) || null;
                const putts = parseInt(document.getElementById(`p_putts_${i}`).value) || null;

                if (name) {
                    players.push({
                        cart_name: name,
                        total_score: total,
                        out_score: outS,
                        in_score: inS,
                        putts: putts
                    });
                }
            }

            const roundData = {
                authorId: myProfile.id || 'usr_nagahara',
                authorName: myProfile.name || '長原 健太',
                authorAvatar: myProfile.avatar || '',
                playDate: playDate,
                courseName: courseName,
                visibility: visibility,
                memo: memo,
                players: players,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (editId) {
                    await db.collection("rounds").doc(editId).update(roundData);
                    showToast('✅ ラウンドを更新しました');
                } else {
                    roundData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    roundData.photos = ['https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600'];
                    roundData.bestPhotoIndex = 0;
                    await db.collection("rounds").add(roundData);
                    showToast('🎉 ラウンドを新規保存しました！');
                }
                closeRecordModal();
            } catch (err) {
                await showAppAlert('エラー', '保存に失敗しました: ' + err.message);
            }
        }

                    <button onclick="document.getElementById('detailModal').style.display='none'" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
                </div>
                <div style="font-size:12px; color:var(--text-sub); margin-bottom:12px;">📅 プレー日: ${r.playDate} ｜ 投稿者: ${r.authorName}</div>
                ${photoUrl ? `<img src="${photoUrl}" style="width:100%; border-radius:8px; margin-bottom:14px;">` : ''}
                
                <table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px;">

                        </tr>
                    </thead>
                    <tbody>
                        ${(r.players || []).map(p => `

                                <td style="padding:8px; font-weight:700;">${p.cart_name}</td>
                                <td style="padding:8px; text-align:center;">${p.out_score || '-'}</td>
                                <td style="padding:8px; text-align:center;">${p.in_score || '-'}</td>

                                <td style="padding:8px; text-align:center;">${p.putts || '-'}</td>

                <div style="display:flex; gap:8px;">

        async function deleteRound(roundId) {
            if (confirm('このラウンド記録を削除してもよろしいですか？')) {
                try {
                    await db.collection("rounds").doc(roundId).delete();
                    showToast('🗑️ ラウンド記録を削除しました');
                    document.getElementById('detailModal').style.display = 'none';
                } catch (e) {
                    await showAppAlert('エラー', '削除に失敗しました: ' + e.message);
                }
            }
        }

        // -------------------------------------------------------------
        // ギャラリー
        // -------------------------------------------------------------
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            const photoRounds = rounds.filter(r => !r.isAwardPost && r.photos && r.photos.length > 0);
            grid.innerHTML = photoRounds.map(r => `

        // -------------------------------------------------------------
        // 振り返り (Memory) - 自分の実績のみを抽出
        // -------------------------------------------------------------
        function switchSummaryTab(tab) {
            currentSummaryTab = tab;
            document.getElementById('btn-sum-members').style.fontWeight = (tab === 'members' ? '700' : '400');
            document.getElementById('btn-sum-courses').style.fontWeight = (tab === 'courses' ? '700' : '400');
            renderSummary(tab);
        }

        function toggleDrilldown(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('open');
        }

        function renderSummary(type) {
            const container = document.getElementById('summary-content');
            if (!container) return;

            const myName = (myProfile.name || '長原 健太').trim();
            const myNameNoSpace = myName.replace(/\s+/g, '');

            // 自分が参加しているラウンドのみを抽出
            const accessibleRounds = rounds.filter(r => {
                if (r.isAwardPost) return false;
                const isAuthor = (r.authorId && r.authorId === myProfile.id) || (r.authorName && r.authorName.trim().replace(/\s+/g, '') === myNameNoSpace);
                const isPlayer = (r.players || []).some(p => {
                    const pName = (p.cart_name || '').trim().replace(/\s+/g, '');
                    return pName === myNameNoSpace || pName.includes(myNameNoSpace);
                });
                return isAuthor || isPlayer;
            });

            if (type === 'members') {
                const memberMap = {};
                accessibleRounds.forEach(r => {
                    (r.players || []).forEach(p => {
                        const pName = (p.cart_name || 'プレイヤー').trim();
                        if (!memberMap[pName]) {
                            memberMap[pName] = { count: 0, scores: [], rounds: [] };
                        }
                        memberMap[pName].count += 1;
                        if (p.total_score) memberMap[pName].scores.push(p.total_score);
                        memberMap[pName].rounds.push({
                            roundId: r.id,
                            courseName: r.courseName || '未設定コース',
                            playDate: r.playDate || '',
                            score: p.total_score || '-',
                            photo: (r.photos && r.photos[r.bestPhotoIndex]) || (r.photos && r.photos.length ? r.photos[0] : 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600')
                        });
                    });
                });

                container.innerHTML = Object.keys(memberMap).map((name, idx) => {
                    const data = memberMap[name];
                    const avg = data.scores.length ? (data.scores.reduce((a,b)=>a+b, 0) / data.scores.length).toFixed(1) : '-';
                    const best = data.scores.length ? Math.min(...data.scores) : '-';

                    const historyList = data.rounds.map(rd => `
                        <div class="drilldown-item" onclick="showDetail('${rd.roundId}')">
                            <img src="${rd.photo}" class="drilldown-thumb">
                            <div style="flex:1;">
                                <div style="font-weight:700; color:var(--primary); font-size:12px;">${rd.courseName}</div>
                                <div style="color:var(--text-sub); font-size:10px;">📅 ${rd.playDate}</div>
                            </div>
                            <div style="font-weight:700; color:var(--primary); font-family:'Cinzel',serif; font-size:14px;">${rd.score}</div>
                        </div>
                    `).join('');

                    return `
                        <div class="card" style="padding:14px; margin-bottom:10px;">
                            <div onclick="toggleDrilldown('drilldown-member-${idx}')" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-size:15px; font-weight:700; color:var(--primary);">👤 ${name}</div>
                                    <div style="font-size:11px; color:var(--text-sub); margin-top:3px;">
                                        ラウンド: <strong>${data.count}回</strong> ｜ ベスト: <strong>${best}</strong> ｜ 平均: <strong>${avg}</strong>
                                    </div>
                                </div>
                                <span style="font-size:11px; color:var(--gold); font-weight:700;">▼ 履歴</span>
                            </div>
                            <div class="drilldown-container" id="drilldown-member-${idx}">
                                ${historyList}
                            </div>
                        </div>
                    `;
                }).join('') || '<p style="color:var(--text-sub); text-align:center; padding:20px;">データがありません</p>';

            } else {
                // コース別
                const courseMap = {};
                accessibleRounds.forEach(r => {
                    const courseName = (r.courseName || '未設定コース').trim();
                    if (!courseMap[courseName]) {
                        courseMap[courseName] = { count: 0, bestScore: 999, rounds: [] };
                    }
                    courseMap[courseName].count += 1;

                    const myPlayerObj = (r.players || []).find(p => {
                        const pName = (p.cart_name || '').trim().replace(/\s+/g, '');
                        return pName === myNameNoSpace || pName.includes(myNameNoSpace);
                    }) || (r.players && r.players[0] ? r.players[0] : null);

                    const myScore = (myPlayerObj && myPlayerObj.total_score) ? myPlayerObj.total_score : null;
                    if (myScore) {
                        courseMap[courseName].bestScore = Math.min(courseMap[courseName].bestScore, myScore);
                    }

                    courseMap[courseName].rounds.push({
                        roundId: r.id,
                        playDate: r.playDate || '',
                        score: myScore || '-',
                        photo: (r.photos && r.photos[r.bestPhotoIndex]) || (r.photos && r.photos.length ? r.photos[0] : 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600')
                    });
                });

                container.innerHTML = Object.keys(courseMap).map((course, idx) => {
                    const data = courseMap[course];
                    const best = data.bestScore === 999 ? '-' : data.bestScore;

                    const historyList = data.rounds.map(rd => `
                        <div class="drilldown-item" onclick="showDetail('${rd.roundId}')">
                            <img src="${rd.photo}" class="drilldown-thumb">
                            <div style="flex:1;">
                                <div style="font-weight:700; color:var(--primary); font-size:12px;">📅 ${rd.playDate}</div>
                            </div>
                            <div style="font-weight:700; color:var(--primary); font-family:'Cinzel',serif; font-size:14px;">スコア: ${rd.score}</div>
                        </div>
                    `).join('');

                    return `
                        <div class="card" style="padding:14px; margin-bottom:10px;">
                            <div onclick="toggleDrilldown('drilldown-course-${idx}')" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-size:15px; font-weight:700; color:var(--primary);">⛳ ${course}</div>
                                    <div style="font-size:11px; color:var(--text-sub); margin-top:3px;">
                                        訪問: <strong>${data.count}回</strong> ｜ ベスト: <strong>${best}</strong>
                                    </div>
                                </div>
                                <span style="font-size:11px; color:var(--gold); font-weight:700;">▼ 履歴</span>
                            </div>
                            <div class="drilldown-container" id="drilldown-course-${idx}">
                                ${historyList}
                            </div>
                        </div>
                    `;
                }).join('') || '<p style="color:var(--text-sub); text-align:center; padding:20px;">データがありません</p>';
            }
        }

        // -------------------------------------------------------------
        // 分析 (Analytics)
        // -------------------------------------------------------------
        function renderAnalytics() {
            const container = document.getElementById('analytics-content');
            if (!container) return;

            const myNameNoSpace = (myProfile.name || '長原 健太').trim().replace(/\s+/g, '');
            const myScores = [];
            const myPutts = [];

            rounds.forEach(r => {
                if (r.isAwardPost) return;
                const p = (r.players || []).find(pl => {
                    const pName = (pl.cart_name || '').trim().replace(/\s+/g, '');
                    return pName === myNameNoSpace || pName.includes(myNameNoSpace);
                });
                if (p && p.total_score) {
                    myScores.push(p.total_score);
                    if (p.putts) myPutts.push(p.putts);
                }
            });

            if (myScores.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-sub); padding:20px;">まだあなたのスコアデータがありません</p>';
                return;
            }

            const best = Math.min(...myScores);
            const avg = (myScores.reduce((a,b)=>a+b, 0) / myScores.length).toFixed(1);
            const avgPutts = myPutts.length ? (myPutts.reduce((a,b)=>a+b, 0) / myPutts.length).toFixed(1) : '-';

            container.innerHTML = `
                <h3 style="color:var(--primary); font-size:16px; margin-bottom:14px; text-align:center;">📊 あなたのスタッツ概要</h3>
                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center;">
                    <div style="background:var(--card-sub-bg); padding:12px 6px; border-radius:8px;">
                        <div style="font-size:10px; color:var(--text-sub);">ラウンド数</div>
                        <div style="font-size:18px; font-weight:700; color:var(--primary); font-family:'Cinzel',serif;">${myScores.length}</div>
                    </div>
                    <div style="background:var(--card-sub-bg); padding:12px 6px; border-radius:8px;">
                        <div style="font-size:10px; color:var(--text-sub);">ベスト</div>
                        <div style="font-size:18px; font-weight:700; color:var(--gold); font-family:'Cinzel',serif;">${best}</div>
                    </div>
                    <div style="background:var(--card-sub-bg); padding:12px 6px; border-radius:8px;">
                        <div style="font-size:10px; color:var(--text-sub);">平均スコア</div>
                        <div style="font-size:18px; font-weight:700; color:var(--primary); font-family:'Cinzel',serif;">${avg}</div>
                    </div>
                </div>
            `;
        }

        // -------------------------------------------------------------
        // 設定 & 月間AIアワード
        // -------------------------------------------------------------
        function openSettingsModal() {
            const m = new Date();
            const yyyy = m.getFullYear();
            const mm = String(m.getMonth() + 1).padStart(2, '0');
            document.getElementById('awardTargetMonth').value = `${yyyy}-${mm}`;
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function toggleTheme() {
            document.body.classList.toggle('theme-dark');
            const isDark = document.body.classList.contains('theme-dark');
            localStorage.setItem('golf_theme_dark', isDark ? '1' : '0');
        }

        async function triggerManualAward() {
            const targetMonth = document.getElementById('awardTargetMonth').value;
            if (!targetMonth) return;

            showToast('🤖 AI審査員が選考中...');
            closeSettingsModal();

            const monthRounds = rounds.filter(r => !r.isAwardPost && r.playDate && r.playDate.startsWith(targetMonth));

            let awardText = `【${targetMonth} 月間公式Golstagramアワード】\n今月は計 ${monthRounds.length} ラウンドの熱戦が繰り広げられました！\n\n`;
            awardText += `🎖️ 最優秀ベストスコア賞: 素晴らしい集中力と安定したプレーを称えます！\n`;
            awardText += `💬 AI審査員講評: 各自の成長とゴルフ愛が光る見事な1ヶ月でした。来月もGood Golfを！`;

            const awardPost = {
                isAwardPost: true,
                title: `${targetMonth} 月間Golstagramアワード`,
                playDate: `${targetMonth}-28`,
                memo: awardText,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("rounds").add(awardPost);
                showToast('🏆 アワードをタイムラインに発表しました！');
            } catch (e) {
                await showAppAlert('エラー', 'アワード投稿に失敗しました: ' + e.message);
            }
        }

        // -------------------------------------------------------------
        // アプリ起動時初期化
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('golf_theme_dark') === '1') {
                document.body.classList.add('theme-dark');
            }
            initFirestoreListener();
            checkUserAuth();
        });
    </script>
</body>
</html>
