<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golstagram | No Golf no Life</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- HEIC変換ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            --bg-color: #f4efe6;
            --surface-card: #ffffff;
            --header-bg: #1c3829;
            --primary: #2d5a3f;
            --primary-light: rgba(45, 90, 63, 0.08);
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37, #aa820a);
            --pink-btn: #f43f5e;
            --border: #e2d9cc;
            --text-main: #2b2b2b;
            --text-sub: #78716c;
            --danger: #ef4444;
            --tab-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(var(--tab-height) + 40px);
            overflow-x: hidden;
        }

        /* ========= ヘッダー ========= */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            border-bottom: 2px solid var(--gold);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
        }
        .app-brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo-main {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .logo-main span {
            color: var(--gold);
        }
        .logo-sub {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-settings {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        /* ========= メインコンテンツ ========= */
        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 14px;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* ========= カードデザイン ========= */
        .card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .author-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }
        .author-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .card-img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
            background: #eee;
        }
        .card-body {
            padding: 14px;
        }

        /* ========= 確定マッチバナーカード ========= */
        .confirmed-match-banner {
            background: linear-gradient(135deg, #c59b27, #997300);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 16px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(153, 115, 0, 0.25);
        }
        .confirmed-match-inner {
            background: #ffffff;
            color: var(--text-main);
            border-radius: 10px;
            padding: 14px;
            margin-top: 8px;
        }

        /* ========= フローティングアクションボタン ========= */
        .fab-container {
            position: fixed;
            bottom: calc(var(--tab-height) + 16px);
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 900;
        }
        .fab-btn {
            border: none;
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        .fab-match {
            background: var(--header-bg);
        }
        .fab-register {
            background: var(--pink-btn);
        }

        /* ========= ボタン共通 ========= */
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-cancel {
            background: #e5e7eb;
            color: #4b5563;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-sm-del {
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #d1d5db;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* ========= スコア記号スタイル ========= */
        .score-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            margin: 0 1px;
        }
        .score-eagle {
            border: 2px double #d4af37;
            border-radius: 50%;
            color: #b8860b;
            background: rgba(212, 175, 55, 0.15);
        }
        .score-birdie {
            border: 2px solid #ef4444;
            border-radius: 50%;
            color: #dc2626;
            background: rgba(239, 68, 68, 0.1);
        }
        .score-par {
            color: var(--text-main);
        }
        .score-bogey {
            border: 2px solid #3b82f6;
            border-radius: 3px;
            color: #2563eb;
            background: rgba(59, 130, 246, 0.1);
        }
        .score-double {
            border: 2px solid #6b7280;
            border-radius: 3px;
            box-shadow: 0 0 0 1px #6b7280 inset;
            color: #4b5563;
            background: rgba(107, 114, 128, 0.1);
        }

        /* ========= スコアテーブル ========= */
        .score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
        .score-table th, .score-table td {
            border: 1px solid var(--border);
            padding: 8px 4px;
        }
        .score-table th {
            background: #ede6d8;
            color: var(--text-sub);
            font-weight: 600;
        }
        .detail-row {
            display: none;
        }
        .detail-row.open {
            display: table-row;
        }

        /* ========= 下部ナビゲーションタブ ========= */
        nav.nav-tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--tab-height);
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            text-decoration: none;
            font-size: 10px;
            padding: 4px 0;
            cursor: pointer;
        }
        .tab-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .tab-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        /* ========= ギャラリー ========= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .gallery-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        .gallery-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }
        .gallery-card-info {
            padding: 8px;
        }

        /* ========= 📷 写真拡大モーダル（ライトボックス） ========= */
        .photo-lightbox-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
        }
        .photo-lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .photo-lightbox-overlay img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }
        .photo-lightbox-overlay.active img {
            transform: scale(1);
        }
        .btn-close-lightbox {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========= トースト通知 & モーダル ========= */
        #toast {
            position: fixed;
            bottom: calc(var(--tab-height) + 20px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            background: #fdfbf7;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="app-brand">
            <span class="logo-main">Golstagram<span>.</span></span>
            <span class="logo-sub">No Golf no Life</span>
        </div>
        <div class="header-actions">
            <button class="btn-settings" onclick="showScreen('screen-members')" title="設定・プロフィール">⚙️</button>
        </div>
    </header>

    <!-- フローティングボタン（マッチ & 登録） -->
    <div class="fab-container">
        <button class="fab-btn fab-match" onclick="openMatchCreateModal()">
            ⛳ Golsta マッチ
        </button>
        <button class="fab-btn fab-register" onclick="openRegistrationModal()">
            ＋ Golsta 登録
        </button>
    </div>

    <!-- メイン表示領域 -->
    <main>
        <!-- 1. タイムライン画面 -->
        <section id="screen-home" class="screen active">
            <!-- 確定マッチ表示枠 -->
            <div id="confirmedMatchesContainer"></div>
            <!-- ラウンド一覧 -->
            <div id="timelineContainer"></div>
        </section>

        <!-- 2. ギャラリー画面 -->
        <section id="screen-gallery" class="screen">
            <h3 style="font-size:15px; margin-bottom:12px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary);">📷 想い出ギャラリー</h3>
            <div id="allGalleryContainer" class="gallery-grid"></div>
        </section>

        <!-- 3. 振り返り画面 -->
        <section id="screen-summary" class="screen">
            <h3 style="font-size:15px; margin-bottom:12px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary);">📊 ラウンド振り返り</h3>
            <div id="summaryContainer"></div>
        </section>

        <!-- 4. 分析画面 -->
        <section id="screen-analytics" class="screen">
            <h3 style="font-size:15px; margin-bottom:12px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary);">📈 スコア分析</h3>
            <div id="analyticsContainer">
                <div class="card" style="padding:16px; text-align:center;">
                    <div style="font-size:12px; color:var(--text-sub);">平均スコア</div>
                    <div id="avgScoreDisplay" style="font-size:32px; font-weight:700; color:var(--primary); font-family:'Cinzel',serif; margin:8px 0;">--</div>
                    <div style="font-size:12px; color:var(--text-sub);">登録ラウンド数: <span id="totalRoundsCount">0</span> 回</div>
                </div>
            </div>
        </section>

        <!-- 5. ラウンド詳細画面 -->
        <section id="screen-detail" class="screen">
            <div style="margin-bottom: 12px;">
                <button id="detailBackBtn" class="btn-cancel" style="padding:6px 12px; font-size:12px;">← タイムラインに戻る</button>
            </div>
            <div id="detail-content"></div>
        </section>

        <!-- 6. メンバー・設定画面 -->
        <section id="screen-members" class="screen">
            <div class="card" style="padding:16px;">
                <h3 style="font-size:15px; margin-bottom:14px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary);">👤 プロフィール設定</h3>
                <div class="form-group">
                    <label class="form-label">ゴルファー名 (表示名)</label>
                    <input type="text" id="profUserName" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">ユーザーID</label>
                    <input type="text" id="profUserId" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">アイコン画像URL</label>
                    <input type="text" id="profAvatar" class="form-input">
                </div>
                <button type="button" class="btn-primary" style="width:100%; margin-top:8px;" onclick="saveMyProfile()">プロフィールを保存</button>
                <button type="button" class="btn-cancel" style="width:100%; margin-top:10px; color:var(--danger);" onclick="executeLogout()">🚪 ログアウト</button>
            </div>
        </section>
    </main>

    <!-- 下部ナビゲーションタブ -->
    <nav class="nav-tabs">
        <div class="tab-item active" onclick="switchNavTab('screen-home', this)">
            <span class="icon">🏠</span>
            <span>タイムライン</span>
        </div>
        <div class="tab-item" onclick="switchNavTab('screen-gallery', this)">
            <span class="icon">🖼️</span>
            <span>ギャラリー</span>
        </div>
        <div class="tab-item" onclick="switchNavTab('screen-summary', this)">
            <span class="icon">👥</span>
            <span>振り返り</span>
        </div>
        <div class="tab-item" onclick="switchNavTab('screen-analytics', this)">
            <span class="icon">📊</span>
            <span>分析</span>
        </div>
        <div class="tab-item" onclick="switchNavTab('screen-members', this)">
            <span class="icon">👤</span>
            <span>メンバー</span>
        </div>
    </nav>

    <!-- 📷 写真拡大プレビュー用モーダル -->
    <div id="photoPreviewModal" class="photo-lightbox-overlay" onclick="closePhotoModal()">
        <button class="btn-close-lightbox" onclick="closePhotoModal()">✕</button>
        <img id="lightboxImage" src="" alt="拡大写真" onclick="event.stopPropagation()">
    </div>

    <!-- 新規登録/編集モーダル -->
    <div id="registrationModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="regModalTitle" style="margin-bottom: 12px; font-size:16px; color:var(--primary);">⛳ Golsta 登録</h3>
            
            <div class="form-group">
                <label class="form-label">過去のコース履歴から選ぶ</label>
                <select id="quickCourseSelect" class="form-select" onchange="applyQuickCourseName(this)">
                    <option value="">-- コースを選択するとPARも自動反映 --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">ゴルフ場・コース名</label>
                <input type="text" id="courseName" class="form-input" placeholder="例: 熱海ゴルフ倶楽部">
            </div>

            <div class="form-group">
                <label class="form-label">プレー日</label>
                <input type="date" id="playDate" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">公開設定</label>
                <select id="visibility" class="form-select">
                    <option value="public">🌐 全体公開</option>
                    <option value="private">🔒 非公開 (自分のみ)</option>
                </select>
            </div>

            <div id="scorecardEditorContainer"></div>

            <div style="display:flex; gap:10px; margin-top:16px;">
                <button type="button" class="btn-primary" style="flex:1;" onclick="saveRoundData()">保存する</button>
                <button type="button" class="btn-cancel" onclick="closeRegistrationModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <script>
        // -------------------------------------------------------------
        // Firebase 設定
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForGolstagram",
            authDomain: "golstagram-app.firebaseapp.com",
            projectId: "golstagram-app",
            storageBucket: "golstagram-app.appspot.com",
            messagingSenderId: "17878832666",
            appId: "1:17878832666:web:dummy"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 状態管理
        let rounds = [];
        let matches = [];
        let myProfile = { id: '', name: '', avatar: '' };
        let tempParData = {
            out: [4, 5, 3, 5, 4, 4, 3, 4, 4],
            in: [5, 4, 5, 4, 3, 4, 3, 4, 4]
        };
        let tempPlayers = [
            { cart_name: 'Player 1', out_scores: [4, 5, 3, 5, 4, 4, 3, 4, 4], in_scores: [5, 4, 5, 4, 3, 4, 3, 4, 4], out_total: 36, in_total: 36, total_score: 72 }
        ];
        let editingRoundId = null;

        // トースト通知
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 確認ダイアログ
        function showAppConfirm(title, message, okText = 'OK', cancelText = 'キャンセル') {
            return new Promise((resolve) => {
                const res = confirm(`${title}\n\n${message}`);
                resolve(res);
            });
        }

        // タブ切り替え
        function switchNavTab(screenId, tabEl) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (tabEl) tabEl.classList.add('active');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // -------------------------------------------------------------
        // 📷 写真拡大モーダル（ライトボックス）
        // -------------------------------------------------------------
        function openPhotoModal(imgSrc) {
            const modal = document.getElementById('photoPreviewModal');
            const imgEl = document.getElementById('lightboxImage');
            if (!modal || !imgEl) return;
            imgEl.src = imgSrc;
            modal.classList.add('active');
        }

        function closePhotoModal() {
            const modal = document.getElementById('photoPreviewModal');
            if (modal) modal.classList.remove('active');
        }

        // -------------------------------------------------------------
        // ⛳ スコア記号判定
        // -------------------------------------------------------------
        function formatScoreWithSymbol(score, par) {
            if (!score) return '-';
            if (!par) return `<span class="score-badge score-par">${score}</span>`;
            const diff = score - par;
            if (diff <= -2) return `<span class="score-badge score-eagle">${score}</span>`;
            if (diff === -1) return `<span class="score-badge score-birdie">${score}</span>`;
            if (diff === 0)  return `<span class="score-badge score-par">${score}</span>`;
            if (diff === 1)  return `<span class="score-badge score-bogey">${score}</span>`;
            return `<span class="score-badge score-double">${score}</span>`;
        }

        // -------------------------------------------------------------
        // コース履歴選択・PAR自動補完
        // -------------------------------------------------------------
        function applyQuickCourseName(selectEl) {
            if (!selectEl.value) return;
            const selectedCourse = selectEl.value;
            document.getElementById('courseName').value = selectedCourse;

            const pastRound = rounds.find(r => !r.isAwardPost && r.courseName === selectedCourse && r.par);
            if (pastRound && pastRound.par) {
                tempParData = JSON.parse(JSON.stringify(pastRound.par));
                renderScorecardEditor();
                showToast(`⛳ 「${selectedCourse}」のPAR設定を自動読込しました！`);
            }
            selectEl.value = '';
        }

        function updateQuickCourseOptions() {
            const selectEl = document.getElementById('quickCourseSelect');
            if (!selectEl) return;
            const courses = [...new Set(rounds.filter(r => !r.isAwardPost && r.courseName).map(r => r.courseName))];
            selectEl.innerHTML = '<option value="">-- コースを選択するとPARも自動反映 --</option>' +
                courses.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        // -------------------------------------------------------------
        // タイムライン描画（確定マッチカード ＋ ラウンド）
        // -------------------------------------------------------------
        function getVisibleTimelineRounds() {
            return rounds.filter(r => {
                if (r.visibility === 'private') {
                    return (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name);
                }
                return true;
            });
        }

        function renderConfirmedMatches() {
            const container = document.getElementById('confirmedMatchesContainer');
            if (!container) return;
            const confirmed = matches.filter(m => m.status === 'confirmed');

            if (confirmed.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = confirmed.map(m => `
                <div class="confirmed-match-banner">
                    <div style="font-weight:700; font-size:14px; display:flex; justify-content:space-between; align-items:center;">
                        <span>🎉 満員御礼！ 日程＆メンバー決定！</span>
                    </div>
                    <div style="font-size:12px; opacity:0.9; margin-top:2px;">⛳ ${m.title || '秋のゴルフ'}</div>
                    <div class="confirmed-match-inner">
                        <div style="font-size:12px; line-height:1.7;">
                            <div>📅 <strong>確定日:</strong> ${m.finalDate || '-'}</div>
                            <div>⛳ <strong>ゴルフ場:</strong> ${m.course || '-'}</div>
                            <div>👥 <strong>確定メンバー (${(m.members || []).length}名):</strong> ${(m.members || []).map(x => x.name).join(', ')}</div>
                        </div>
                        <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                            <button class="btn-sm-del" onclick="deleteMatch('${m.id}')">🗑️ 削除</button>
                            <a href="https://line.me/R/msg/text/?${encodeURIComponent('⛳【ゴルフ確定案内】\n日程: ' + m.finalDate + '\n場所: ' + m.course)}" target="_blank" style="background:#06c755; color:#fff; text-decoration:none; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700;">🟢 確定内容をLINEに報告</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderTimeline() {
            renderConfirmedMatches();
            const container = document.getElementById('timelineContainer');
            if (!container) return;
            const visibleRounds = getVisibleTimelineRounds();

            if (visibleRounds.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--text-sub); font-size:13px;">まだ投稿がありません⛳</div>';
                return;
            }

            container.innerHTML = visibleRounds.map(r => {
                const cover = (r.photos && r.photos[r.bestPhotoIndex]) || (r.photos && r.photos[0]) || 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600';
                const isMyPost = (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name);

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="author-box">
                                <img src="${r.authorAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'}" class="avatar">
                                <div>
                                    <div class="author-name">${r.authorName || 'ゴルファー'}</div>
                                    <div style="font-size:11px; color:var(--text-sub);">📅 ${r.playDate} プレー</div>
                                </div>
                            </div>
                            ${isMyPost ? `<button class="btn-sm-del" onclick="deleteRound('${r.id}')">🗑️ 削除</button>` : ''}
                        </div>
                        <img src="${cover}" class="card-img" loading="lazy" onclick="showDetail('${r.id}', 'home')" style="cursor:pointer;">
                        <div class="card-body" onclick="showDetail('${r.id}', 'home')" style="cursor:pointer;">
                            <h3 style="font-size:16px; color:var(--primary); margin-bottom:4px;">${r.courseName}</h3>
                            <div style="font-size:12px; color:var(--gold); font-weight:700;">TOTAL: ${(r.players && r.players[0]) ? r.players[0].total_score : '-'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // -------------------------------------------------------------
        // 📷 ギャラリー描画（写真タップで拡大）
        // -------------------------------------------------------------
        function renderAllGallery() {
            const container = document.getElementById('allGalleryContainer');
            if (!container) return;

            const visibleRounds = getVisibleTimelineRounds();
            let items = [];

            visibleRounds.forEach(r => {
                if (r.photos && r.photos.length > 0) {
                    r.photos.forEach(photoUrl => {
                        items.push({
                            photo: photoUrl,
                            courseName: r.courseName,
                            playDate: r.playDate
                        });
                    });
                }
            });

            if (items.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 13px;">まだ写真が登録されていません📷</div>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="gallery-card" onclick="openPhotoModal('${item.photo}')">
                    <img src="${item.photo}" loading="lazy">
                    <div class="gallery-card-info">
                        <div style="font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.courseName}</div>
                        <div style="color: var(--text-sub); font-size: 10px;">📅 ${item.playDate}</div>
                    </div>
                </div>
            `).join('');
        }

        // -------------------------------------------------------------
        // 振り返り & 分析
        // -------------------------------------------------------------
        function renderSummary() {
            const container = document.getElementById('summaryContainer');
            if (!container) return;
            const myRounds = rounds.filter(r => (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name));
            
            if (myRounds.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--text-sub); font-size:13px;">あなたのラウンド記録はまだありません⛳</div>';
                return;
            }

            container.innerHTML = myRounds.map(r => `
                <div class="card" style="padding:14px; margin-bottom:10px; cursor:pointer;" onclick="showDetail('${r.id}', 'summary')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700; font-size:14px; color:var(--primary);">${r.courseName}</div>
                            <div style="font-size:11px; color:var(--text-sub);">📅 ${r.playDate}</div>
                        </div>
                        <div style="font-family:'Cinzel',serif; font-size:18px; font-weight:700; color:var(--gold);">
                            ${(r.players && r.players[0]) ? r.players[0].total_score : '-'}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderAnalytics() {
            const myRounds = rounds.filter(r => (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name));
            const countEl = document.getElementById('totalRoundsCount');
            const avgEl = document.getElementById('avgScoreDisplay');
            if (!countEl || !avgEl) return;

            countEl.textContent = myRounds.length;
            if (myRounds.length === 0) {
                avgEl.textContent = '--';
                return;
            }

            const total = myRounds.reduce((sum, r) => sum + ((r.players && r.players[0] && r.players[0].total_score) ? Number(r.players[0].total_score) : 0), 0);
            avgEl.textContent = (total / myRounds.length).toFixed(1);
        }

        // -------------------------------------------------------------
        // ラウンド詳細（スコア記号表示対応）
        // -------------------------------------------------------------
        function toggleScoreDetail(type) {
            document.querySelectorAll(`[id^="detail-${type}-"]`).forEach(el => {
                el.classList.toggle('open');
            });
        }

        function showDetail(roundId, fromScreen = 'home') {
            const r = rounds.find(item => item.id === roundId);
            if (!r) return;

            const cover = (r.photos && r.photos[r.bestPhotoIndex]) || (r.photos && r.photos.length ? r.photos[0] : 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600');
            const detail = document.getElementById('detail-content');
            const backBtn = document.getElementById('detailBackBtn');

            if (fromScreen === 'gallery') {
                backBtn.setAttribute('onclick', "showScreen('screen-gallery')");
                backBtn.innerHTML = '← ギャラリーに戻る';
            } else if (fromScreen === 'summary') {
                backBtn.setAttribute('onclick', "showScreen('screen-summary')");
                backBtn.innerHTML = '← 振り返りに戻る';
            } else {
                backBtn.setAttribute('onclick', "showScreen('screen-home')");
                backBtn.innerHTML = '← タイムラインに戻る';
            }
            
            const isMyPost = (r.authorId && r.authorId === myProfile.id) || (r.authorName === myProfile.name);
            const editBtnHtml = isMyPost ? `<button class="btn-cancel" style="padding:4px 10px; font-size:11px; margin-bottom:10px;" onclick="openEditRegistration('${r.id}')">✏️ 編集</button>` : '';

            const outPars = r.par?.out || [4,5,3,5,4,4,3,4,4];
            const inPars = r.par?.in || [5,4,5,4,3,4,3,4,4];

            let scoreRows = (r.players || []).map((p, pIdx) => {
                const outScoresHtml = (p.out_scores || []).map((sc, i) => formatScoreWithSymbol(sc, outPars[i])).join(' ');
                const inScoresHtml = (p.in_scores || []).map((sc, i) => formatScoreWithSymbol(sc, inPars[i])).join(' ');

                return `
                    <tr>
                        <td style="font-weight:700;">${p.cart_name}</td>
                        <td style="font-family:'Cinzel',serif;">${p.out_total}</td>
                        <td style="font-family:'Cinzel',serif;">${p.in_total}</td>
                        <td style="font-weight:700; color:var(--primary); font-family:'Cinzel',serif; font-size:16px;">${p.total_score}</td>
                    </tr>
                    <tr class="detail-row" id="detail-out-${pIdx}">
                        <td colspan="4" style="background:var(--primary-light); padding:8px; text-align:left;">
                            <div style="font-size:11px; font-weight:700; margin-bottom:4px; color:var(--primary);">OUT (1-9H 打数):</div>
                            <div style="display:flex; gap:4px; flex-wrap:wrap; align-items:center;">${outScoresHtml}</div>
                        </td>
                    </tr>
                    <tr class="detail-row" id="detail-in-${pIdx}">
                        <td colspan="4" style="background:var(--primary-light); padding:8px; text-align:left;">
                            <div style="font-size:11px; font-weight:700; margin-bottom:4px; color:var(--primary);">IN (10-18H 打数):</div>
                            <div style="display:flex; gap:4px; flex-wrap:wrap; align-items:center;">${inScoresHtml}</div>
                        </td>
                    </tr>
                `;
            }).join('');

            let galleryHtml = (r.photos || []).map(p => `
                <img src="${p}" style="width:100%; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer;" onclick="openPhotoModal('${p}')">
            `).join('');

            detail.innerHTML = `
                <div class="card">
                    <img src="${cover}" class="card-img" style="height:240px;">
                    <div class="card-body">
                        ${editBtnHtml}
                        <h2 style="color:var(--primary); font-size:20px; margin-bottom:4px;">${r.courseName}</h2>
                        <p style="color:var(--text-sub); font-size:12px; margin-bottom:14px;">プレー日: ${r.playDate}</p>
                        
                        <h4 style="margin-top:14px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary); font-size:14px;">📊 スコア一覧</h4>
                        <div style="margin: 8px 0;">
                            <button class="btn-cancel" style="padding:4px 8px; font-size:11px;" onclick="toggleScoreDetail('out')">OUT各ホール 展開/収納</button>
                            <button class="btn-cancel" style="padding:4px 8px; font-size:11px;" onclick="toggleScoreDetail('in')">IN各ホール 展開/収納</button>
                        </div>
                        <table class="score-table">
                            <thead>
                                <tr>
                                    <th>プレイヤー</th>
                                    <th>OUT</th>
                                    <th>IN</th>
                                    <th>TOTAL</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${scoreRows}
                            </tbody>
                        </table>

                        <h4 style="margin:20px 0 10px; border-left:4px solid var(--primary); padding-left:8px; color:var(--primary); font-size:14px;">📷 想い出ギャラリー (${(r.photos || []).length}枚)</h4>
                        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
                            ${galleryHtml || '<p style="font-size:12px; color:var(--text-sub);">写真はありません</p>'}
                        </div>
                    </div>
                </div>
            `;
            showScreen('screen-detail');
        }

        // -------------------------------------------------------------
        // スコアカード入力テーブルエディタ
        // -------------------------------------------------------------
        function renderScorecardEditor() {
            const container = document.getElementById('scorecardEditorContainer');
            if (!container) return;

            let outParInputs = tempParData.out.map((v, i) => `<input type="number" value="${v}" style="width:26px; text-align:center; border:1px solid #d1d5db; border-radius:4px;" onchange="tempParData.out[${i}]=parseInt(this.value)||4">`).join('');
            let inParInputs = tempParData.in.map((v, i) => `<input type="number" value="${v}" style="width:26px; text-align:center; border:1px solid #d1d5db; border-radius:4px;" onchange="tempParData.in[${i}]=parseInt(this.value)||4">`).join('');

            container.innerHTML = `
                <div style="margin-top:12px; border:1px solid var(--border); border-radius:8px; padding:10px; background:#faf7f0;">
                    <div style="font-size:12px; font-weight:700; color:var(--primary); margin-bottom:6px;">⛳ ホール別 PAR設定</div>
                    <div style="font-size:11px; color:var(--text-sub);">OUT (1-9H):</div>
                    <div style="display:flex; gap:3px; overflow-x:auto; padding-bottom:6px;">${outParInputs}</div>
                    <div style="font-size:11px; color:var(--text-sub); margin-top:4px;">IN (10-18H):</div>
                    <div style="display:flex; gap:3px; overflow-x:auto; padding-bottom:6px;">${inParInputs}</div>
                </div>
            `;
        }

        function openRegistrationModal() {
            editingRoundId = null;
            document.getElementById('regModalTitle').textContent = '⛳ 新規ラウンド登録';
            document.getElementById('courseName').value = '';
            document.getElementById('playDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('visibility').value = 'public';
            updateQuickCourseOptions();
            renderScorecardEditor();
            document.getElementById('registrationModal').style.display = 'flex';
        }

        function openEditRegistration(roundId) {
            const r = rounds.find(item => item.id === roundId);
            if (!r) return;
            editingRoundId = roundId;
            document.getElementById('regModalTitle').textContent = '✏️ ラウンドの編集';
            document.getElementById('courseName').value = r.courseName || '';
            document.getElementById('playDate').value = r.playDate || '';
            document.getElementById('visibility').value = r.visibility || 'public';
            if (r.par) tempParData = JSON.parse(JSON.stringify(r.par));
            if (r.players) tempPlayers = JSON.parse(JSON.stringify(r.players));
            updateQuickCourseOptions();
            renderScorecardEditor();
            document.getElementById('registrationModal').style.display = 'flex';
        }

        function closeRegistrationModal() {
            document.getElementById('registrationModal').style.display = 'none';
        }

        async function saveRoundData() {
            const courseName = document.getElementById('courseName').value.trim();
            const playDate = document.getElementById('playDate').value;
            const visibility = document.getElementById('visibility').value;

            if (!courseName) {
                showToast('ゴルフ場名を入力してください');
                return;
            }

            const roundPayload = {
                courseName,
                playDate,
                visibility,
                par: tempParData,
                players: tempPlayers,
                authorId: myProfile.id,
                authorName: myProfile.name,
                authorAvatar: myProfile.avatar,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (editingRoundId) {
                    await db.collection('rounds').doc(editingRoundId).update(roundPayload);
                    showToast('ラウンド情報を更新しました！');
                } else {
                    roundPayload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    roundPayload.photos = ['https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=600'];
                    roundPayload.bestPhotoIndex = 0;
                    await db.collection('rounds').add(roundPayload);
                    showToast('新規ラウンドを登録しました！');
                }
                closeRegistrationModal();
            } catch (e) {
                console.error('保存エラー:', e);
                showToast('保存に失敗しました');
            }
        }

        async function deleteRound(roundId) {
            const ok = await showAppConfirm('削除の確認', 'このラウンド記録を削除してもよろしいですか？');
            if (!ok) return;
            try {
                await db.collection('rounds').doc(roundId).delete();
                showToast('ラウンドを削除しました');
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteMatch(matchId) {
            const ok = await showAppConfirm('削除の確認', 'このマッチ募集をタイムラインから削除しますか？');
            if (!ok) return;
            try {
                await db.collection('matches').doc(matchId).delete();
                showToast('マッチを削除しました');
            } catch (e) {
                console.error(e);
            }
        }

        function openMatchCreateModal() {
            showToast('マッチ募集機能（作成中）');
        }

        // -------------------------------------------------------------
        // プロフィール管理・ログアウト
        // -------------------------------------------------------------
        function loadMyProfile() {
            const saved = localStorage.getItem('golf_my_profile');
            if (saved) {
                try {
                    myProfile = JSON.parse(saved);
                } catch (e) {
                    console.error(e);
                }
            }
            if (!myProfile.id) {
                myProfile = {
                    id: 'user_' + Math.random().toString(36).substring(2, 8),
                    name: '長原健太',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'
                };
            }
            document.getElementById('profUserId').value = myProfile.id;
            document.getElementById('profUserName').value = myProfile.name;
            document.getElementById('profAvatar').value = myProfile.avatar;
        }

        function saveMyProfile() {
            myProfile.id = document.getElementById('profUserId').value.trim() || myProfile.id;
            myProfile.name = document.getElementById('profUserName').value.trim() || myProfile.name;
            myProfile.avatar = document.getElementById('profAvatar').value.trim() || myProfile.avatar;
            localStorage.setItem('golf_my_profile', JSON.stringify(myProfile));
            showToast('プロフィールを更新しました！');
            renderTimeline();
            renderSummary();
            renderAnalytics();
        }

        async function executeLogout() {
            const ok = await showAppConfirm(
                'ログアウトの確認',
                'ログアウトしますか？\n端末内のログイン情報がクリアされ、初期状態に戻ります。',
                'ログアウト',
                'キャンセル'
            );
            if (!ok) return;

            localStorage.removeItem('golf_my_profile');
            showToast('🚪 ログアウトしました');
            setTimeout(() => {
                window.location.reload();
            }, 500);
        }

        // -------------------------------------------------------------
        // Firestore リアルタイム同期
        // -------------------------------------------------------------
        function initFirestoreListeners() {
            db.collection("rounds").onSnapshot((snapshot) => {
                let fetched = [];
                snapshot.forEach(doc => {
                    fetched.push({ id: doc.id, ...doc.data() });
                });
                fetched.sort((a, b) => (b.playDate || '').localeCompare(a.playDate || ''));
                rounds = fetched;
                renderTimeline();
                renderAllGallery();
                renderSummary();
                renderAnalytics();
            }, (error) => {
                console.error("Firestore同期エラー(rounds):", error);
            });

            db.collection("matches").onSnapshot((snapshot) => {
                let fetched = [];
                snapshot.forEach(doc => {
                    fetched.push({ id: doc.id, ...doc.data() });
                });
                matches = fetched;
                renderConfirmedMatches();
            }, (error) => {
                console.error("Firestore同期エラー(matches):", error);
            });
        }

        function checkUserAuth() {
            loadMyProfile();
            initFirestoreListeners();
        }

        checkUserAuth();
    </script>
</body>
</html>
